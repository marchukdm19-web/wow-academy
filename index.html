<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOW Academy | Авторизація</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
 body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #19B51F, #0f8a17);
  padding: 20px;
  box-sizing: border-box;
}

  .box {
    background: white;
    width: 400px;
    padding: 45px;
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    text-align: center;
  }

  /* ✅ ФІКС ЛОГО */
  .logo {
    width: 140px;
    height: auto;
    display: block;
    margin: 0 auto 20px;
  }

  .subtitle {
    font-size: 15px;
    color: #555;
    margin-bottom: 25px;
    font-weight: 500;
  }

  input {
    padding: 15px;
    font-size: 15px;
    width: 100%;
    border-radius: 12px;
    border: 1px solid #ddd;
    outline: none;
    transition: 0.3s;
    margin-bottom: 15px;
  }

  input:focus {
    border-color: #19B51F;
    box-shadow: 0 0 0 3px rgba(25,181,31,0.15);
  }

  /* ✅ рівна галочка */
  .show-pass {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #555;
    margin-top: -5px;
    margin-bottom: 15px;
    justify-content: center;
  }

  .show-pass input {
    width: auto;
    margin: 0;
  }

  /* ✨ glow кнопки */
  button {
    margin-top: 10px;
    padding: 15px;
    width: 100%;
    font-size: 15px;
    border: none;
    border-radius: 12px;
    background: #19B51F;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 0 rgba(25,181,31,0);
  }

  button:hover {
    background: #0f8a17;
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(25,181,31,0.6);
  }

  .error {
    color: #e74c3c;
    margin-top: 12px;
    display: none;
    font-size: 14px;
  }

  .footer {
    margin-top: 25px;
    font-size: 12px;
    color: #999;
  }

  /* 📱 МОБІЛЬНА ВЕРСІЯ — НІЧОГО НЕ ВИДАЛЕНО, ТІЛЬКИ ДОДАНО */
 @media (max-width: 480px) {

  body {
    align-items: flex-start;   /* щоб не було дивного центрування */
    padding-top: 40px;         /* нормальний відступ зверху */
  }

  .box {
    width: 100%;
    max-width: 100%;
  }

}

    .logo {
      width: 110px;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      font-size: 14px;
      padding: 14px;
    }

    button {
      font-size: 14px;
      padding: 14px;
    }

    .footer {
      font-size: 11px;
    }
  }

</style>
</head>

<body>

<div class="box">

  <img src="logo.png" alt="WOW Camp" class="logo">

  <div class="subtitle">
    Авторизуйтеся до платформи навчання академії тім-лідерів WOW CAMP
  </div>

  <input type="text" id="login" placeholder="Введіть логін">

  <input type="password" id="pass" placeholder="Введіть пароль">

  <label class="show-pass">
    <input type="checkbox" onclick="togglePassword()">
    Показати пароль
  </label>

  <button onclick="checkPass()">Увійти</button>

  <div class="error" id="error">Невірний пароль</div>

  <div class="footer">
    © 2026 WOW Academy
  </div>

</div>

<script>

let allowRedirect = false; 
// ❗ Коли потрібно відновити перехід на сайт — просто змінити на true

function togglePassword() {
  const pass = document.getElementById("pass");
  pass.type = pass.type === "password" ? "text" : "password";
}

function checkPass() {
  const password = document.getElementById("pass").value;

  const validPasswords = [
    "StudentWOW",
    "8787WOW",
    "WOW",
    "WOW2026"
  ];

  if (validPasswords.includes(password)) {

    if (allowRedirect) {
      // ✅ Коли набір відкритий
      window.location.href = "https://www.wowcampacademy.biz.ua/wow-академія";
    } else {
      // 🔒 Коли набір ще не відкритий
      alert("Програма Академія тім-лідерів ще не відкрила набір.");
    }

  } else {
    document.getElementById("error").style.display = "block";
  }
}

</script>
</body>
</html>
